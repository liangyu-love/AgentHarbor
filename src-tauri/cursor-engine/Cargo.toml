[package]
name = "cursor-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Serves Cursor's Agent protocol locally for AgentHarbor's Cursor injection"
license = "MIT"

[lib]
name = "cursor_engine"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
dirs = "6"
dom_smoothie = "0.18"
encoding_rs = "0.8"
eventsource-stream = "0.2"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
include_dir = "0.7"
log = "0.4"
parking_lot = "0.12"
percent-encoding = "2"
prost = "0.13"
prost-types = "0.13"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "socks", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "fs"] }
tracing = { version = "0.1", features = ["log"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
