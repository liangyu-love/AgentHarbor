[package]
name = "agent-harbor"
version = "1.0.0"
default-run = "AgentHarbor"
description = "Cross-platform coding-agent desktop workspace"
authors = ["AgentHarbor contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "agentharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AgentHarbor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "rustls-tls", "socks", "stream"], default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSThread", "NSGeometry", "NSValue", "NSArray", "NSString", "NSNotification", "NSOperation", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSRunningApplication", "NSApplication", "NSWorkspace", "NSEvent", "NSColor"] }
