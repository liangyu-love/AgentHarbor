[package]
name = "agent-harbor"
version = "1.2.0"
default-run = "AgentHarbor"
description = "Cross-platform coding-agent desktop workspace"
authors = ["AgentHarbor contributors"]
license = "Apache-2.0"
edition = "2021"
# Locked dependencies (notably notify-rust) require Rust 1.89.
rust-version = "1.89"

[workspace]
members = ["cursor-engine"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "agentharbor_lib"
# Desktop binaries link this crate as an rlib. Building an unused Windows
# cdylib exceeds MinGW's export ordinal limit and blocks cargo build/test.
crate-type = ["rlib"]

[[bin]]
name = "AgentHarbor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
# Cursor's Runs are tested against an HTTP/2 stand-in.
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "=2.3.3"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "0.4"
# Edits Cursor's settings.json in place, keeping its comments and layout.
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
# Edits DeepSeek Harness YAML (profile patch, credentials) in place, keeping comments and `!!js` tags.
yaml-edit = { version = "0.3", default-features = false }
# An independent reading of every Harness edit before it is written.
serde_yaml = "0.9"
rquickjs = "0.11"
percent-encoding = "2"
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["blocking", "http2", "json", "multipart", "rustls-tls", "socks", "stream", "system-proxy"], default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
# The proxy matcher resolves the system proxy per request (see api_client).
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-proxy", "client-proxy-system"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
# Codex compresses Responses bodies with zstd for its built-in OpenAI provider.
zstd = { version = "0.13", default-features = false }
sha2 = "0.10"
# MiniMax Code signs its account and check-in requests with md5, as its client does.
md-5 = "0.10"
# ZCode's app keeps its sign-in AES-GCM encrypted; Trae binds its tokens to a P-256 device key.
ring = "0.17"
# Qoder's COSY envelope: the account AES-128-CBC encrypted, its key RSA-wrapped with Qoder's public key.
aes = "0.8"
rsa = "0.9"
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
# Edits Codex and Claude Code configuration on remote hosts over SSH/SFTP.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
# Serves Cursor's Agent protocol for the Cursor injection.
cursor-engine = { path = "cursor-engine" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_Security", "Win32_NetworkManagement_IpHelper"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSThread", "NSGeometry", "NSValue", "NSArray", "NSString", "NSNotification", "NSOperation", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSRunningApplication", "NSApplication", "NSWorkspace", "NSEvent", "NSColor"] }
